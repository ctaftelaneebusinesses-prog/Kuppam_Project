plugins {
    id 'com.android.application'
}

android {
    namespace 'com.onetowncity.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.onetowncity.app'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    def storeFilePath = System.getenv('ONETOWNCITY_STORE_FILE') ?: project.findProperty('ONETOWNCITY_STORE_FILE')
    def storePasswordValue = System.getenv('ONETOWNCITY_STORE_PASSWORD') ?: project.findProperty('ONETOWNCITY_STORE_PASSWORD')
    def keyAliasValue = System.getenv('ONETOWNCITY_KEY_ALIAS') ?: project.findProperty('ONETOWNCITY_KEY_ALIAS')
    def keyPasswordValue = System.getenv('ONETOWNCITY_KEY_PASSWORD') ?: project.findProperty('ONETOWNCITY_KEY_PASSWORD')
    if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
        signingConfigs {
            release {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
}

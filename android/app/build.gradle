plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// Public Supabase project URL + anon (publishable) key — the same two values
// the web app injects into signin.html via {{ SUPABASE_URL }} / {{ SUPABASE_ANON_KEY }}
// (see hello_kuppam/settings.py and core/supabase_auth.py). Not secrets: the
// anon key is designed for client embedding and is already shipped to every
// browser that loads the sign-in page. Sourced from local.properties (gitignored,
// mirrors the Django .env) with an env var fallback for CI, matching the
// release-signing lookup pattern below.
def supabaseUrl = System.getenv('ONETOWNCITY_SUPABASE_URL') ?: localProperties.getProperty('SUPABASE_URL') ?: ''
def supabaseAnonKey = System.getenv('ONETOWNCITY_SUPABASE_ANON_KEY') ?: localProperties.getProperty('SUPABASE_ANON_KEY') ?: ''

android {
    namespace 'com.onetowncity.app'
    compileSdk = 36

    defaultConfig {
        applicationId 'com.onetowncity.app'
        minSdk = 23
        targetSdk = 36
        versionCode 1
        versionName '1.0.0'

        buildConfigField 'String', 'SUPABASE_URL', "\"${supabaseUrl}\""
        buildConfigField 'String', 'SUPABASE_ANON_KEY', "\"${supabaseAnonKey}\""

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    def storeFilePath = System.getenv('ONETOWNCITY_STORE_FILE') ?: project.findProperty('ONETOWNCITY_STORE_FILE')
    def storePasswordValue = System.getenv('ONETOWNCITY_STORE_PASSWORD') ?: project.findProperty('ONETOWNCITY_STORE_PASSWORD')
    def keyAliasValue = System.getenv('ONETOWNCITY_KEY_ALIAS') ?: project.findProperty('ONETOWNCITY_KEY_ALIAS')
    def keyPasswordValue = System.getenv('ONETOWNCITY_KEY_PASSWORD') ?: project.findProperty('ONETOWNCITY_KEY_PASSWORD')
    if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
        signingConfigs {
            release {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.4'

    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material3:material3-window-size-class'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Chrome Custom Tabs — hosts the Supabase-hosted Google OAuth page (the
    // same provider config the web app uses via supabase-js) so Android never
    // implements its own copy of the Google sign-in flow.
    implementation 'androidx.browser:browser:1.8.0'
    // Encrypted at-rest storage for the Supabase access/refresh token pair.
    implementation 'androidx.security:security-crypto:1.1.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.10.01')
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}

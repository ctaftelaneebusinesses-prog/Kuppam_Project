org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.9.1 predates official "tested" support for compileSdk/targetSdk 36
# (added around AGP 8.11); suppresses the resulting build warning until the
# project is bumped to a newer AGP/Gradle pairing that can be verified with
# a real Android SDK.
android.suppressUnsupportedCompileSdk=36

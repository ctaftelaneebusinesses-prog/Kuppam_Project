# Render Blueprint — creates the web service from this repo.
# In Render: New + > Blueprint > pick this repo. Values marked `sync: false`
# are prompted for once in the dashboard and are never stored in git.
services:
  - type: web
    name: onetowncity
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    # Render ignores the Procfile's `release:` line, so migrations run here.
    # Pre-Deploy Commands would be cleaner but are paid-plan only.
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: >-
      gunicorn hello_kuppam.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers ${WEB_CONCURRENCY:-2} --threads ${WEB_THREADS:-6}
      --worker-class gthread --timeout 30 --graceful-timeout 30
      --max-requests 500 --max-requests-jitter 50 --preload --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      # Free instances have 512 MB RAM; 2 workers x 6 threads fits.
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SECRET_KEY
        generateValue: true
      # e.g. onetowncity.onrender.com (plus your own domain later, comma-separated)
      - key: ALLOWED_HOSTS
        sync: false
      # e.g. https://onetowncity.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Supabase transaction pooler URL (port 6543)
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: media
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_ADMIN_EMAIL
        sync: false

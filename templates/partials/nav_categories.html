{% load i18n hk_extras %}
{% if nav_category_tree %}
<li class="nav-item dropdown hk-nav-cat-dropdown">
    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-grid-3x3-gap"></i> {% trans "Categories" %}
    </a>
    <ul class="dropdown-menu hk-nav-cat-menu">
        {% for cat in nav_category_tree %}
        <li><a class="dropdown-item fw-semibold" href="{{ cat.list_url }}"><i class="bi {{ cat.icon }}"></i> {{ cat.label|dyntrans }}</a></li>
        {% endfor %}
    </ul>
</li>
{% endif %}

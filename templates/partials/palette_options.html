<!-- Shared palette option buttons — included by both the desktop floating
     panel and the mobile drawer's inline row (base.html). Kept in one place
     so the 4 looks (and their copy) never drift apart between the two. -->
<button type="button" class="hk-palette-option" data-palette="default" role="menuitemradio" aria-pressed="false">
    <span class="hk-palette-option-swatch"></span>
    <span class="hk-palette-option-text">
        <span class="hk-palette-option-name">Default</span>
        <span class="hk-palette-option-desc">OneTownCity amber, light/dark</span>
    </span>
    <i class="bi bi-check-circle-fill hk-palette-option-check"></i>
</button>

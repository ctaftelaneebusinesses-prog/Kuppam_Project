{% extends 'base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<section class="container py-5">
    <h3 class="fw-bold mb-4">My Favorites</h3>

    <div class="row g-3">
        {% for item in items %}
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 hk-card">
                <div class="card-body d-flex flex-column">
                    <span class="badge bg-primary-subtle text-primary mb-2 align-self-start">{{ item.label|title }}</span>
                    <h5 class="card-title">{{ item.obj }}</h5>
                    <a href="{{ item.obj.get_absolute_url }}" class="btn btn-outline-primary mt-auto">
                        View Details <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center text-muted py-5">You haven't saved any favorites yet.</div>
        {% endfor %}
    </div>
</section>
{% endblock %}

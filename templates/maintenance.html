<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance - OneTownCity</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff8ef;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            color: #2b2418;
            text-align: center;
            padding: 24px;
        }
        .hk-maintenance-card {
            max-width: 480px;
        }
        .hk-maintenance-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 12px;
        }
        p {
            color: #6b6252;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="hk-maintenance-card">
        <div class="hk-maintenance-icon">🛠️</div>
        <h1>We'll be right back</h1>
        <p>{{ message }}</p>
    </div>
</body>
</html>

{% extends "admin/base.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/admin_custom.css' %}">
{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}">
        <i class="bi bi-geo-alt-fill"></i> {{ site_header|default:"Hello Kuppam Admin" }}
    </a>
</div>
{% endblock %}

{% block nav-global %}
<div class="hk-admin-quicklinks">
    <a href="{% url 'core:upload_hub' %}"><i class="bi bi-cloud-arrow-up"></i> Excel Upload Center</a>
    <a href="{% url 'core:home' %}" target="_blank"><i class="bi bi-box-arrow-up-right"></i> View Site</a>
</div>
{% endblock %}
